
name: Build Amar Hisab APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AmarHisabAndroid.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: |
          unzip -q AmarHisabAndroid.zip -d project
          test -f project/AmarHisabAndroid/app/build.gradle.kts

      - name: Build debug APK
        working-directory: project/AmarHisabAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Hisab-APK
          path: project/AmarHisabAndroid/app/build/outputs/apk/debug/app-debug.apk
